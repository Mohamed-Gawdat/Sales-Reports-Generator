<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Reports Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="page-wrapper">

  <header>
    <div class="header-inner">
      <div class="logo-mark">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="11" height="11" rx="3" fill="white" opacity="0.9"/>
          <rect x="15" y="2" width="11" height="11" rx="3" fill="white" opacity="0.5"/>
          <rect x="2" y="15" width="11" height="11" rx="3" fill="white" opacity="0.5"/>
          <rect x="15" y="15" width="11" height="11" rx="3" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="header-title">SalesGen</span>
        <span class="header-sub">Sohag Station · Sales Reports</span>
      </div>
    </div>
  </header>

  <main class="container">

    <div class="shift-selector">
      <p class="selector-label">Select shift type</p>
      <div class="tab-group" id="tabGroup">
        <button class="tab active" data-value="am" onclick="selectTab(this,'am')">
          AM Shift
        </button>
        <button class="tab" data-value="bm" onclick="selectTab(this,'bm')">
          BM Shift
        </button>
        <button class="tab" data-value="closing" onclick="selectTab(this,'closing')">
          Closing
        </button>
        <div class="tab-slider" id="tabSlider"></div>
      </div>
      <input type="hidden" id="shiftType" value="am">
    </div>

    <div id="inputs" class="inputs-area"></div>

    <button class="generate-btn" onclick="generateMessage()">
      <span class="btn-text">Generate Report</span>
      <span class="btn-arrow">→</span>
      <div class="btn-shine"></div>
    </button>

    <div class="output-wrap" id="outputWrap">
      <div class="output-header">
        <span class="output-label">Generated Message</span>
        <div class="output-actions">
          <button class="icon-btn" onclick="copyMessage()" title="Copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
          </button>
          <button class="icon-btn" onclick="shareMessage()" title="Share">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>
        </div>
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>

  </main>

  <footer>
    <span>Developed by <strong>Mohamed Gawdat</strong></span>
    <span class="footer-sep">·</span>
    <span>Sales Management</span>
    <span class="footer-sep">·</span>
    <span>ID: 320290</span>
  </footer>

</div>

<div id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  Copied to clipboard
</div>

<script src="app.js"></script>
</body>
</html>
