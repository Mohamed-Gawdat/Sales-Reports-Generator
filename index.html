<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ShiftGen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-512.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── Template defaults ───────────────────────────────────────────────────────
const TEMPLATE_KEY = "shiftgen.template.v1";
const DEFAULT_TEMPLATE = {
  stationName: "Sohag Station",
  headerSub: "Sohag Station · Sales Reports",
  am: { voiceCommit: 25, emeraldCommit: 1, cashCommit: 23 },
  pm: {
    voiceTarget: 50, postTarget: 1, connTarget: 4, cashTarget: 47, mnpTarget: 2,
    voiceMonthly: 1509, postMonthly: 10, connMonthly: 105, cashMonthly: 1427, mnpMonthly: 64
  },
  closing: { reviewedBy: "" }
};

function loadTemplate() {
  try {
    const s = localStorage.getItem(TEMPLATE_KEY);
    if (s) {
      const o = JSON.parse(s);
      return {
        ...DEFAULT_TEMPLATE, ...o,
        am: { ...DEFAULT_TEMPLATE.am, ...(o.am ?? {}) },
        pm: { ...DEFAULT_TEMPLATE.pm, ...(o.pm ?? {}) },
        closing: { ...DEFAULT_TEMPLATE.closing, ...(o.closing ?? {}) }
      };
    }
  } catch {}
  return DEFAULT_TEMPLATE;
}

function saveTemplate(t) { localStorage.setItem(TEMPLATE_KEY, JSON.stringify(t)); }

function useTemplate() {
  const [template, setTemplate] = useState(loadTemplate);
  const updateTemplate = useCallback(t => { saveTemplate(t); setTemplate(t); }, []);
  return { template, updateTemplate };
}

// ─── Date / helpers ──────────────────────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return `${d.getDate()} / ${d.toLocaleString("en", { month: "short" })} / ${d.getFullYear()}`;
}

function pct(a, b) { return b > 0 ? `${Math.round(a / b * 100)}%` : "—"; }

// ─── Report generators ───────────────────────────────────────────────────────
function generateAM(tmpl, v) {
  const cashNet = v.cashAch - v.cashRefund;
  return `${tmpl.stationName}\n${todayStr()}\nAM\n\n- Voice Commitment: ${v.voiceCommit}\n- Voice Achievement: ${v.voiceAch}\n\n- Emerald Commitment: ${v.emeraldCommit}\n- Emerald Achievement: ${v.emeraldAch}\n\n- Primo: ${v.primo}\n\n- Cash Commitment: ${v.cashCommit}\n- Cash Achievement: ${cashNet}\n\n- Connectivity Ach: ${v.connect}\n\n- MNP: ${v.mnp}`;
}

function generatePM(tmpl, v) {
  const day = new Date().getDate();
  const pm = tmpl.pm;
  const voiceMtd = v.voiceDaily + v.voiceMtdYesterday;
  const voiceMtdTarget = v.voiceTarget * day;
  const postMtd = v.postDaily + v.postMtdYesterday;
  const postMtdTarget = Math.min(v.postTarget * day, pm.postMonthly);
  const connMtd = v.connDaily + v.connMtdYesterday;
  const connMtdTarget = v.connTarget * day;
  const cashNet = v.cashDaily - v.cashRefund;
  const cashMtd = v.cashDaily + v.cashMtdYesterday;
  const cashMtdTarget = v.cashTarget * day;
  const mnpMtd = v.mnpDaily + v.mnpMtdYesterday;
  const mnpMtdTarget = v.mnpTarget * day;
  const cr = v.trx > 0 ? `${Math.round(v.voiceDaily / v.trx * 100)}%` : "—";
  return `${tmpl.stationName}\n${todayStr()}\n——————————————\nVoice Lines (${pm.voiceMonthly})\n- Daily Target: ${v.voiceTarget}\n- Daily Ach: ${v.voiceDaily}\n- MTD Target: ${voiceMtdTarget}\n- MTD Ach: ${voiceMtd}\n- RE: ${pct(voiceMtd, voiceMtdTarget)}\n——————————————\nPostpaid (${pm.postMonthly})\n- Daily Target: ${v.postTarget}\n- Daily Ach: ${v.postDaily}\n• Emerald: ${v.emerald}\n• Primo: ${v.primoPost}\n- MTD Target: ${postMtdTarget}\n- MTD Ach: ${postMtd}\n- RE: ${pct(postMtd, postMtdTarget)}\n——————————————\nConnectivity (${pm.connMonthly})\n- Daily Target: ${v.connTarget}\n- Daily Ach: ${v.connDaily}\n- E-Home: ${v.ehome}\n- ADSL: ${v.adsl}\n- MTD Target: ${connMtdTarget}\n- MTD Ach: ${connMtd}\n- RE: ${pct(connMtd, connMtdTarget)}\n——————————————\nCash Service (${pm.cashMonthly})\n- Daily Target: ${v.cashTarget}\n- Daily Ach: ${cashNet}\n- MTD Target: ${cashMtdTarget}\n- MTD Ach: ${cashMtd}\n- RE: ${pct(cashMtd, cashMtdTarget)}\n——————————————\nMNP (${pm.mnpMonthly})\n- Daily Target: ${v.mnpTarget}\n- Daily Ach: ${v.mnpDaily}\n- MTD Target: ${mnpMtdTarget}\n- MTD Ach: ${mnpMtd}\n- RE: ${pct(mnpMtd, mnpMtdTarget)}\n——————————————\nTotal TRX ${v.trx}\nClosing Ratio: ${cr}`;
}

function generateClosing(tmpl, v) {
  const d = new Date();
  const dateStr = `${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()}`;
  return `${tmpl.stationName}\n${dateStr}\nClosing Confirmation\n\nQuality\n ✅ Contracts revision\n ✅ Forms revision\n ✅ Win cash over 1000 LE\n ✅ Pending Cash in/out\n ✅ Returned dials/status\n ✅ Migration/change ownership SDF\n\nStock\n ✅ QOH\n ✅ Low stock\n\nCash\n ✅ M-commerce revised\n ✅ Staff drawers closing\n ✅ Any over/short Cash (0)\n\nReviewed By ${v.reviewedBy}`;
}

// ─── Shared input components ──────────────────────────────────────────────────
// FIX: inputs show empty when value is 0, placeholder shows "0"
// On blur, empty → stays 0 internally but shows empty visually
function NumField({ label, id, value, onChange, placeholder = "0" }) {
  const [display, setDisplay] = useState(value === 0 ? "" : String(value));

  // Sync when parent resets
  useEffect(() => {
    setDisplay(value === 0 ? "" : String(value));
  }, [value]);

  return (
    <div className="sg-field">
      <label htmlFor={id}>{label}</label>
      <input
        id={id}
        type="number"
        className="sg-input"
        value={display}
        placeholder={placeholder}
        min={0}
        autoComplete="off"
        onChange={e => {
          setDisplay(e.target.value);
          onChange(e.target.value === "" ? 0 : Number(e.target.value) || 0);
        }}
        onFocus={e => { if (display === "0") setDisplay(""); }}
      />
    </div>
  );
}

function TargetField({ label, id, value, onChange }) {
  const [display, setDisplay] = useState(value === 0 ? "" : String(value));

  useEffect(() => {
    setDisplay(value === 0 ? "" : String(value));
  }, [value]);

  return (
    <div className="sg-field">
      <label htmlFor={id}>{label}</label>
      <input
        id={id}
        type="number"
        className="sg-input target-input"
        value={display}
        placeholder="0"
        min={0}
        autoComplete="off"
        onChange={e => {
          setDisplay(e.target.value);
          onChange(e.target.value === "" ? 0 : Number(e.target.value) || 0);
        }}
      />
      <span className="target-hint">editable target</span>
    </div>
  );
}

function TextField({ label, id, value, onChange, placeholder = "" }) {
  return (
    <div className="sg-field">
      <label htmlFor={id}>{label}</label>
      <input
        id={id}
        type="text"
        className="sg-input"
        value={value}
        placeholder={placeholder}
        autoComplete="off"
        onChange={e => onChange(e.target.value)}
      />
    </div>
  );
}

// Template editor number field — same empty-on-zero fix
function TplNumField({ label, value, onChange }) {
  const [display, setDisplay] = useState(value === 0 ? "" : String(value));

  useEffect(() => {
    setDisplay(value === 0 ? "" : String(value));
  }, [value]);

  return (
    <div className="sg-field">
      <label>{label}</label>
      <input
        type="number"
        className="sg-input"
        value={display}
        placeholder="0"
        min={0}
        autoComplete="off"
        onChange={e => {
          setDisplay(e.target.value);
          onChange(e.target.value === "" ? 0 : Number(e.target.value) || 0);
        }}
      />
    </div>
  );
}

function TplTextField({ label, value, onChange, placeholder = "" }) {
  return (
    <div className="sg-field">
      <label>{label}</label>
      <input
        type="text"
        className="sg-input"
        value={value}
        placeholder={placeholder}
        autoComplete="off"
        onChange={e => onChange(e.target.value)}
      />
    </div>
  );
}

// ─── Section card wrapper ─────────────────────────────────────────────────────
function Section({ title, single, children }) {
  return (
    <div className="section-card">
      <div className="section-title">{title}</div>
      <div className={`input-grid${single ? " single" : ""}`}>{children}</div>
    </div>
  );
}

function EditorGroup({ title, single, children }) {
  return (
    <div className="editor-group">
      <div className="editor-group-title">{title}</div>
      <div className={single ? "" : "editor-grid"}>{children}</div>
    </div>
  );
}

// ─── Logo SVG ─────────────────────────────────────────────────────────────────
function Logo() {
  return (
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="11" height="11" rx="3" fill="white" opacity="0.9"/>
      <rect x="15" y="2" width="11" height="11" rx="3" fill="white" opacity="0.5"/>
      <rect x="2" y="15" width="11" height="11" rx="3" fill="white" opacity="0.5"/>
      <rect x="15" y="15" width="11" height="11" rx="3" fill="white" opacity="0.9"/>
    </svg>
  );
}

// ─── Icons ────────────────────────────────────────────────────────────────────
function IconCopy() {
  return <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
}
function IconWA() {
  return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>;
}
function IconSettings() {
  return <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>;
}
function IconBack() {
  return <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
}
function IconReset() {
  return <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
}

// ─── Main generator page ──────────────────────────────────────────────────────
function GeneratorPage({ onNav }) {
  const { template } = useTemplate();
  const [tab, setTab] = useState("am");
  const [output, setOutput] = useState("");
  const [copied, setCopied] = useState(false);
  const sliderRef = useRef(null);
  const tabGroupRef = useRef(null);

  const moveSlider = (idx, total) => {
    if (sliderRef.current) {
      sliderRef.current.style.width = `calc(${100 / total}% - 2px)`;
      sliderRef.current.style.left = `calc(${(idx / total) * 100}% + 5px)`;
    }
  };

  useEffect(() => { moveSlider(0, 3); }, []);

  // AM state
  const [am, setAm] = useState({
    voiceCommit: template.am.voiceCommit, voiceAch: 0,
    emeraldCommit: template.am.emeraldCommit, emeraldAch: 0,
    primo: 0, cashCommit: template.am.cashCommit, cashRefund: 0, cashAch: 0,
    connect: 0, mnp: 0
  });
  const setAmF = (k, v) => setAm(p => ({ ...p, [k]: v }));

  // PM state
  const [pm, setPm] = useState({
    voiceTarget: template.pm.voiceTarget, voiceDaily: 0, voiceMtdYesterday: 0,
    postTarget: template.pm.postTarget, postDaily: 0, emerald: 0, primoPost: 0, postMtdYesterday: 0,
    connTarget: template.pm.connTarget, connDaily: 0, ehome: 0, adsl: 0, connMtdYesterday: 0,
    cashTarget: template.pm.cashTarget, cashRefund: 0, cashDaily: 0, cashMtdYesterday: 0,
    mnpTarget: template.pm.mnpTarget, mnpDaily: 0, mnpMtdYesterday: 0, trx: 0
  });
  const setPmF = (k, v) => setPm(p => ({ ...p, [k]: v }));

  // Closing state
  const [closing, setClosing] = useState({ reviewedBy: template.closing?.reviewedBy ?? "" });
  const setClosingF = (k, v) => setClosing(p => ({ ...p, [k]: v }));

  const selectTab = (t, idx) => { setTab(t); setOutput(""); moveSlider(idx, 3); };

  const generate = () => {
    if (tab === "am") setOutput(generateAM(template, am));
    else if (tab === "pm") setOutput(generatePM(template, pm));
    else setOutput(generateClosing(template, closing));
  };

  const clear = () => {
    setOutput("");
    if (tab === "am") setAm({ voiceCommit: template.am.voiceCommit, voiceAch: 0, emeraldCommit: template.am.emeraldCommit, emeraldAch: 0, primo: 0, cashCommit: template.am.cashCommit, cashRefund: 0, cashAch: 0, connect: 0, mnp: 0 });
    else if (tab === "pm") setPm({ voiceTarget: template.pm.voiceTarget, voiceDaily: 0, voiceMtdYesterday: 0, postTarget: template.pm.postTarget, postDaily: 0, emerald: 0, primoPost: 0, postMtdYesterday: 0, connTarget: template.pm.connTarget, connDaily: 0, ehome: 0, adsl: 0, connMtdYesterday: 0, cashTarget: template.pm.cashTarget, cashRefund: 0, cashDaily: 0, cashMtdYesterday: 0, mnpTarget: template.pm.mnpTarget, mnpDaily: 0, mnpMtdYesterday: 0, trx: 0 });
    else setClosing({ reviewedBy: template.closing?.reviewedBy ?? "" });
  };

  const copy = async () => {
    if (!output.trim()) return;
    await navigator.clipboard.writeText(output);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };

  const whatsapp = () => {
    if (!output.trim()) return;
    window.open("https://wa.me/?text=" + encodeURIComponent(output), "_blank");
  };

  return (
    <>
      <div className="bg-orbs">
        <div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/>
      </div>
      <div className="page-wrapper">
        <header>
          <div className="header-inner">
            <div className="logo-mark"><Logo /></div>
            <div>
              <div className="header-title">ShiftGen</div>
              <div className="header-sub">{template.headerSub}</div>
            </div>
            <button onClick={() => onNav("template")} style={{ marginLeft: "auto" }} className="icon-btn" title="Edit template">
              <IconSettings />
            </button>
          </div>
        </header>

        <div className="container">
          <p className="selector-label">Select shift type</p>
          <div className="tab-group" ref={tabGroupRef}>
            {[["am","AM Shift",0],["pm","PM Shift",1],["closing","Closing",2]].map(([t,label,idx]) => (
              <button key={t} className={`sg-tab${tab === t ? " active" : ""}`} onClick={() => selectTab(t, idx)}>{label}</button>
            ))}
            <div className="tab-slider" ref={sliderRef} />
          </div>

          <div className="inputs-area" key={tab}>
            {tab === "am" && (
              <>
                <Section title="Voice">
                  <TargetField label="Voice Commitment" id="voiceCommit" value={am.voiceCommit} onChange={v => setAmF("voiceCommit", v)} />
                  <NumField label="Voice Achievement" id="voiceAch" value={am.voiceAch} onChange={v => setAmF("voiceAch", v)} />
                </Section>
                <Section title="Emerald">
                  <TargetField label="Emerald Commitment" id="emeraldCommit" value={am.emeraldCommit} onChange={v => setAmF("emeraldCommit", v)} />
                  <NumField label="Emerald Achievement" id="emeraldAch" value={am.emeraldAch} onChange={v => setAmF("emeraldAch", v)} />
                </Section>
                <Section title="Primo" single>
                  <NumField label="Primo" id="primo" value={am.primo} onChange={v => setAmF("primo", v)} />
                </Section>
                <Section title="Cash Service">
                  <TargetField label="Cash Commitment" id="cashCommit" value={am.cashCommit} onChange={v => setAmF("cashCommit", v)} />
                  <NumField label="Refund" id="cashRefundAm" value={am.cashRefund} onChange={v => setAmF("cashRefund", v)} />
                  <NumField label="Cash Achievement" id="cashAch" value={am.cashAch} onChange={v => setAmF("cashAch", v)} />
                </Section>
                <Section title="Other">
                  <NumField label="Connectivity Ach" id="connect" value={am.connect} onChange={v => setAmF("connect", v)} />
                  <NumField label="MNP" id="mnp" value={am.mnp} onChange={v => setAmF("mnp", v)} />
                </Section>
              </>
            )}

            {tab === "pm" && (
              <>
                <Section title="Voice Lines">
                  <TargetField label="Daily Target" id="voiceTarget" value={pm.voiceTarget} onChange={v => setPmF("voiceTarget", v)} />
                  <NumField label="Daily Ach" id="voiceDaily" value={pm.voiceDaily} onChange={v => setPmF("voiceDaily", v)} />
                  <NumField label="MTD Ach Yesterday" id="voiceMtdYesterday" value={pm.voiceMtdYesterday} onChange={v => setPmF("voiceMtdYesterday", v)} />
                </Section>
                <Section title="Postpaid">
                  <TargetField label="Daily Target" id="postTarget" value={pm.postTarget} onChange={v => setPmF("postTarget", v)} />
                  <NumField label="Daily Ach" id="postDaily" value={pm.postDaily} onChange={v => setPmF("postDaily", v)} />
                  <NumField label="Emerald" id="emerald" value={pm.emerald} onChange={v => setPmF("emerald", v)} />
                  <NumField label="Primo" id="primoPost" value={pm.primoPost} onChange={v => setPmF("primoPost", v)} />
                  <NumField label="MTD Ach Yesterday" id="postMtdYesterday" value={pm.postMtdYesterday} onChange={v => setPmF("postMtdYesterday", v)} />
                </Section>
                <Section title="Connectivity">
                  <TargetField label="Daily Target" id="connTarget" value={pm.connTarget} onChange={v => setPmF("connTarget", v)} />
                  <NumField label="Daily Ach" id="connDaily" value={pm.connDaily} onChange={v => setPmF("connDaily", v)} />
                  <NumField label="E-Home" id="ehome" value={pm.ehome} onChange={v => setPmF("ehome", v)} />
                  <NumField label="ADSL" id="adsl" value={pm.adsl} onChange={v => setPmF("adsl", v)} />
                  <NumField label="MTD Ach Yesterday" id="connMtdYesterday" value={pm.connMtdYesterday} onChange={v => setPmF("connMtdYesterday", v)} />
                </Section>
                <Section title="Cash Service">
                  <TargetField label="Daily Target" id="cashTarget" value={pm.cashTarget} onChange={v => setPmF("cashTarget", v)} />
                  <NumField label="Refund" id="cashRefund" value={pm.cashRefund} onChange={v => setPmF("cashRefund", v)} />
                  <NumField label="Daily Ach" id="cashDaily" value={pm.cashDaily} onChange={v => setPmF("cashDaily", v)} />
                  <NumField label="MTD Ach Yesterday" id="cashMtdYesterday" value={pm.cashMtdYesterday} onChange={v => setPmF("cashMtdYesterday", v)} />
                </Section>
                <Section title="MNP">
                  <TargetField label="Daily Target" id="mnpTarget" value={pm.mnpTarget} onChange={v => setPmF("mnpTarget", v)} />
                  <NumField label="Daily Ach" id="mnpDaily" value={pm.mnpDaily} onChange={v => setPmF("mnpDaily", v)} />
                  <NumField label="MTD Ach Yesterday" id="mnpMtdYesterday" value={pm.mnpMtdYesterday} onChange={v => setPmF("mnpMtdYesterday", v)} />
                </Section>
                <Section title="Totals" single>
                  <NumField label="Total TRX" id="trx" value={pm.trx} onChange={v => setPmF("trx", v)} />
                </Section>
              </>
            )}

            {tab === "closing" && (
              <Section title="Confirmation" single>
                <TextField label="Reviewed By" id="reviewedBy" value={closing.reviewedBy} onChange={v => setClosingF("reviewedBy", v)} placeholder="Name" />
              </Section>
            )}
          </div>

          <div style={{ display: "flex", gap: 10, marginTop: 22 }}>
            <button className="generate-btn" style={{ flex: 1, margin: 0 }} onClick={generate}>
              <span className="btn-text">Generate Report</span>
              <span className="btn-arrow">→</span>
              <div className="btn-shine" />
            </button>
            <button onClick={clear} style={{ padding: "17px 18px", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 18, background: "transparent", color: "var(--muted)", cursor: "pointer", fontSize: 13, fontFamily: "var(--font-body)", transition: "all 0.2s", whiteSpace: "nowrap" }}
              onMouseEnter={e => { e.target.style.background = "rgba(255,255,255,0.05)"; e.target.style.color = "var(--text)"; }}
              onMouseLeave={e => { e.target.style.background = "transparent"; e.target.style.color = "var(--muted)"; }}>
              Clear
            </button>
          </div>

          {output && (
            <div className="output-wrap">
              <div className="output-header">
                <span className="output-label">Generated Message</span>
                <div className="output-actions">
                  <button className="icon-btn" onClick={copy} title="Copy"><IconCopy /></button>
                  <button className="icon-btn wa-btn" onClick={whatsapp} title="Share on WhatsApp"><IconWA /></button>
                </div>
              </div>
              <textarea className="sg-textarea" readOnly spellCheck={false} value={output} />
            </div>
          )}
        </div>

        <footer>
          <span>Developed by <strong>Mohamed Gawdat</strong></span>
          <span className="footer-sep">·</span><span>Sales Management</span>
          <span className="footer-sep">·</span><span>ID: 320290</span>
        </footer>
      </div>

      <div className={`toast${copied ? " show" : ""}`}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Copied to clipboard
      </div>
    </>
  );
}

// ─── Template editor page ─────────────────────────────────────────────────────
function TemplatePage({ onNav }) {
  const { template, updateTemplate } = useTemplate();
  const [draft, setDraft] = useState(() => JSON.parse(JSON.stringify(template)));

  const set = (path, val) => {
    setDraft(prev => {
      const next = JSON.parse(JSON.stringify(prev));
      const keys = path.split(".");
      let obj = next;
      for (let i = 0; i < keys.length - 1; i++) obj = obj[keys[i]];
      obj[keys[keys.length - 1]] = val;
      return next;
    });
  };

  const save = () => { updateTemplate(draft); showToast("Template saved"); };
  const reset = () => {
    const def = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    setDraft(def);
    updateTemplate(def);
    showToast("Reset to defaults");
  };

  const [toastMsg, setToastMsg] = useState("");
  const [toastVisible, setToastVisible] = useState(false);
  const showToast = msg => {
    setToastMsg(msg);
    setToastVisible(true);
    setTimeout(() => setToastVisible(false), 2000);
  };

  return (
    <>
      <div className="bg-orbs">
        <div className="orb orb1"/><div className="orb orb2"/><div className="orb orb3"/>
      </div>
      <div className="page-wrapper">
        <header style={{ paddingBottom: 0 }}>
          <div className="header-inner">
            <div className="logo-mark"><Logo /></div>
            <div>
              <div className="header-title">ShiftGen</div>
              <div className="header-sub">Template Settings</div>
            </div>
          </div>
        </header>

        <div className="container" style={{ marginTop: 20 }}>
          <button className="editor-back" onClick={() => onNav("home")}>
            <IconBack /> Back to Generator
          </button>
          <div className="editor-title">Edit Template</div>
          <div className="editor-sub">Customize your station details and default shift targets. Changes are saved to your device.</div>

          {/* General — NO Developer Credit field */}
          <EditorGroup title="General" single>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <TplTextField label="Station Name" value={draft.stationName} onChange={v => set("stationName", v)} />
              <TplTextField label="Header Subtitle" value={draft.headerSub} onChange={v => set("headerSub", v)} />
            </div>
          </EditorGroup>

          <EditorGroup title="AM Shift — Default Commitments">
            <TplNumField label="Voice Commitment" value={draft.am.voiceCommit} onChange={v => set("am.voiceCommit", v)} />
            <TplNumField label="Emerald Commitment" value={draft.am.emeraldCommit} onChange={v => set("am.emeraldCommit", v)} />
            <TplNumField label="Cash Commitment" value={draft.am.cashCommit} onChange={v => set("am.cashCommit", v)} />
          </EditorGroup>

          <EditorGroup title="PM Shift — Daily Targets">
            <TplNumField label="Voice Daily Target" value={draft.pm.voiceTarget} onChange={v => set("pm.voiceTarget", v)} />
            <TplNumField label="Postpaid Daily Target" value={draft.pm.postTarget} onChange={v => set("pm.postTarget", v)} />
            <TplNumField label="Connectivity Daily Target" value={draft.pm.connTarget} onChange={v => set("pm.connTarget", v)} />
            <TplNumField label="Cash Daily Target" value={draft.pm.cashTarget} onChange={v => set("pm.cashTarget", v)} />
            <TplNumField label="MNP Daily Target" value={draft.pm.mnpTarget} onChange={v => set("pm.mnpTarget", v)} />
          </EditorGroup>

          <EditorGroup title="PM Shift — Monthly Targets (shown in report)">
            <TplNumField label="Voice Lines Monthly" value={draft.pm.voiceMonthly} onChange={v => set("pm.voiceMonthly", v)} />
            <TplNumField label="Postpaid Monthly" value={draft.pm.postMonthly} onChange={v => set("pm.postMonthly", v)} />
            <TplNumField label="Connectivity Monthly" value={draft.pm.connMonthly} onChange={v => set("pm.connMonthly", v)} />
            <TplNumField label="Cash Service Monthly" value={draft.pm.cashMonthly} onChange={v => set("pm.cashMonthly", v)} />
            <TplNumField label="MNP Monthly" value={draft.pm.mnpMonthly} onChange={v => set("pm.mnpMonthly", v)} />
          </EditorGroup>

          {/* NEW: Closing section */}
          <EditorGroup title="Closing — Default Reviewed By" single>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <TplTextField label="Default Reviewed By (leave blank for manual entry)" value={draft.closing?.reviewedBy ?? ""} onChange={v => set("closing.reviewedBy", v)} placeholder="e.g. Station Manager" />
            </div>
          </EditorGroup>

          <button className="editor-save-btn" onClick={save}>Save Template</button>
          <button className="editor-reset-btn" onClick={reset}>
            <IconReset style={{ display: "inline", marginRight: 6, verticalAlign: "middle" }} />
            Reset to Defaults
          </button>
        </div>

        <footer style={{ marginTop: 28 }}>
          <span>Developed by <strong>Mohamed Gawdat</strong></span>
          <span className="footer-sep">·</span><span>Sales Management</span>
          <span className="footer-sep">·</span><span>ID: 320290</span>
        </footer>
      </div>

      <div className={`toast${toastVisible ? " show" : ""}`}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        {toastMsg}
      </div>
    </>
  );
}

// ─── App router ───────────────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState("home");
  if (page === "template") return <TemplatePage onNav={setPage} />;
  return <GeneratorPage onNav={setPage} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
