<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Reports Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>

<div class="page-wrapper">

  <header>
    <div class="header-inner">
      <div class="logo-mark">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect x="2" y="2" width="11" height="11" rx="3" fill="white" opacity="0.9"/>
          <rect x="15" y="2" width="11" height="11" rx="3" fill="white" opacity="0.5"/>
          <rect x="2" y="15" width="11" height="11" rx="3" fill="white" opacity="0.5"/>
          <rect x="15" y="15" width="11" height="11" rx="3" fill="white" opacity="0.9"/>
        </svg>
      </div>
      <div class="header-text">
        <span class="header-title">SalesGen</span>
        <span class="header-sub">Sohag Station · Sales Reports</span>
      </div>
    </div>
  </header>

  <main class="container">

    <div class="shift-selector">
      <p class="selector-label">Select shift type</p>
      <div class="tab-group" id="tabGroup">
        <button class="tab active" data-value="am" onclick="selectTab(this,'am')">
          AM Shift
        </button>
        <button class="tab" data-value="bm" onclick="selectTab(this,'bm')">
          BM Shift
        </button>
        <button class="tab" data-value="closing" onclick="selectTab(this,'closing')">
          Closing
        </button>
        <div class="tab-slider" id="tabSlider"></div>
      </div>
      <input type="hidden" id="shiftType" value="am">
    </div>

    <div id="inputs" class="inputs-area"></div>

    <button class="generate-btn" onclick="generateMessage()">
      <span class="btn-text">Generate Report</span>
      <span class="btn-arrow">→</span>
      <div class="btn-shine"></div>
    </button>

    <div class="output-wrap" id="outputWrap">
      <div class="output-header">
        <span class="output-label">Generated Message</span>
        <div class="output-actions">
          <button class="icon-btn" onclick="copyMessage()" title="Copy">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>
          </button>
          <button class="icon-btn whatsapp-btn" onclick="shareMessage()" title="Share on WhatsApp">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
              <path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.126 1.532 5.859L.057 23.617a.75.75 0 00.921.921l5.752-1.474A11.943 11.943 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.75a9.726 9.726 0 01-4.964-1.362l-.355-.211-3.668.94.972-3.558-.232-.366A9.722 9.722 0 012.25 12C2.25 6.615 6.615 2.25 12 2.25S21.75 6.615 21.75 12 17.385 21.75 12 21.75z"/>
            </svg>
          </button>
        </div>
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>

  </main>

  <footer>
    <span>Developed by <strong>Mohamed Gawdat</strong></span>
    <span class="footer-sep">·</span>
    <span>Sales Management</span>
    <span class="footer-sep">·</span>
    <span>ID: 320290</span>
  </footer>

</div>

<div id="toast">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
  Copied to clipboard
</div>

<script src="app.js"></script>
</body>
</html>
